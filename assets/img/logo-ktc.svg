<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- วงกลมสำหรับข้อความโค้ง -->
    <path id="topArc"    d="M 20,100 A 80,80 0 1,1 180,100" fill="none"/>
    <path id="bottomArc" d="M 28,115 A 72,72 0 0,0 172,115" fill="none"/>

    <!-- Gradient พื้นหลัง -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%"   stop-color="#1565c0"/>
      <stop offset="100%" stop-color="#0d2b7a"/>
    </radialGradient>
    <!-- Gradient กลีบเฟือง -->
    <linearGradient id="gearGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffe082"/>
      <stop offset="50%"  stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#f9a825"/>
    </linearGradient>
    <!-- Gradient ไฟแห่งปัญญา -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="30%" y2="0%">
      <stop offset="0%"   stop-color="#ff6f00"/>
      <stop offset="50%"  stop-color="#ffca28"/>
      <stop offset="100%" stop-color="#fff9c4"/>
    </linearGradient>
    <!-- Gradient หนังสือ -->
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e3f2fd"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
  </defs>

  <!-- ═══ วงกลมนอกสุด: กรอบทอง ═══ -->
  <circle cx="100" cy="100" r="97" fill="url(#gearGold)" />
  <!-- วงกลมสีขาวบาง ๆ -->
  <circle cx="100" cy="100" r="92" fill="#fff" />
  <!-- วงกลมพื้นหลังสีน้ำเงิน -->
  <circle cx="100" cy="100" r="88" fill="url(#bgGrad)" />

  <!-- ═══ เส้นประตกแต่งด้านใน ═══ -->
  <circle cx="100" cy="100" r="84" fill="none" stroke="rgba(255,214,0,0.5)" stroke-width="1"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>

  <!-- ═══ เฟืองใหญ่ตรงกลาง ═══ -->
  <g transform="translate(100,100)" filter="url(#shadow)">
    <!-- เฟือง 12 กลีบ -->
    <g fill="url(#gearGold)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
      <!-- กลีบเฟือง 12 ชิ้น (ทุก 30°) -->
      <rect x="-5" y="-42" width="10" height="14" rx="3" transform="rotate(0)"/>
      <rect x="-5" y="-42" width="10" height="14" rx="3" transform="rotate(30)"/>
      <rect x="-5" y="-42" width="10" height="14" rx="3" transform="rotate(60)"/>
      <rect x="-5" y="-42" width="10" height="14" rx="3" transform="rotate(90)"/>
      <rect x="-5" y="-42" width="10" height="14" rx="3" transform="rotate(120)"/>
      <rect x="-5" y="-42" width="10" height="14" rx="3" transform="rotate(150)"/>
      <rect x="-5" y="-42" width="10" height="14" rx="3" transform="rotate(180)"/>
      <rect x="-5" y="-42" width="10" height="14" rx="3" transform="rotate(210)"/>
      <rect x="-5" y="-42" width="10" height="14" rx="3" transform="rotate(240)"/>
      <rect x="-5" y="-42" width="10" height="14" rx="3" transform="rotate(270)"/>
      <rect x="-5" y="-42" width="10" height="14" rx="3" transform="rotate(300)"/>
      <rect x="-5" y="-42" width="10" height="14" rx="3" transform="rotate(330)"/>
      <!-- วงกลมเฟือง -->
      <circle cx="0" cy="0" r="33" fill="url(#gearGold)"/>
      <circle cx="0" cy="0" r="21" fill="#0d2b7a"/>
    </g>
  </g>

  <!-- ═══ ไฟแห่งปัญญา (flame) ═══ -->
  <g transform="translate(100,89)" filter="url(#glow)">
    <!-- เปลวไฟหลัก -->
    <path d="M0,-17 C-6,-10 -9,0 -6,8 C-3,16 3,16 6,8 C9,0 6,-10 0,-17Z" fill="url(#flameGrad)"/>
    <!-- เปลวไฟด้านใน -->
    <path d="M0,-10 C-3,-5 -4,2 -2,6 C0,10 2,6 4,2 C4,-3 2,-8 0,-10Z" fill="#fff9c4" opacity="0.9"/>
  </g>

  <!-- ═══ หนังสือ (ด้านล่างเฟือง) ═══ -->
  <g transform="translate(85,108)">
    <!-- หน้ากระดาษซ้าย -->
    <path d="M15,0 L0,2 L0,16 L15,14 Z" fill="url(#bookGrad)" stroke="rgba(255,214,0,0.7)" stroke-width="0.5"/>
    <!-- หน้ากระดาษขวา -->
    <path d="M15,0 L30,2 L30,16 L15,14 Z" fill="url(#bookGrad)" stroke="rgba(255,214,0,0.7)" stroke-width="0.5"/>
    <!-- สันหนังสือ -->
    <line x1="15" y1="0" x2="15" y2="14" stroke="rgba(255,214,0,0.9)" stroke-width="1"/>
    <!-- เส้นในหนังสือ -->
    <line x1="3"  y1="6"  x2="12" y2="5.5" stroke="rgba(13,43,122,0.4)" stroke-width="0.8"/>
    <line x1="3"  y1="10" x2="12" y2="9.5" stroke="rgba(13,43,122,0.4)" stroke-width="0.8"/>
    <line x1="18" y1="6"  x2="27" y2="5.5" stroke="rgba(13,43,122,0.4)" stroke-width="0.8"/>
    <line x1="18" y1="10" x2="27" y2="9.5" stroke="rgba(13,43,122,0.4)" stroke-width="0.8"/>
  </g>

  <!-- ═══ ข้อความโค้งด้านบน "วิทยาลัยเทคนิคกันทรารมย์" ═══ -->
  <path id="topTextArc" d="M 18,100 A 82,82 0 1,1 182,100" fill="none"/>
  <text font-family="'Noto Sans Thai',Sarabun,Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffd600" letter-spacing="0.5">
    <textPath href="#topTextArc" startOffset="12%">วิทยาลัยเทคนิคกันทรารมย์</textPath>
  </text>

  <!-- ═══ เส้นคั่นระหว่างข้อความกับตราสัญลักษณ์ ═══ -->
  <path d="M 38,148 A 68,68 0 0,0 162,148" fill="none" stroke="rgba(255,214,0,0.7)" stroke-width="0.8"/>

  <!-- ═══ ข้อความโค้งด้านล่าง "KANTHARALAK TECHNICAL" ═══ -->
  <path id="botTextArc" d="M 25,112 A 76,76 0 0,0 175,112" fill="none"/>
  <text font-family="Arial,Helvetica,sans-serif" font-size="8.5" font-weight="700" fill="#ffd600" letter-spacing="1">
    <textPath href="#botTextArc" startOffset="8%">KANTHARALAK TECHNICAL COLLEGE</textPath>
  </text>

  <!-- ═══ ดาวสองข้างตกแต่ง ═══ -->
  <text x="27" y="152" font-size="8" fill="#ffd600" text-anchor="middle">★</text>
  <text x="173" y="152" font-size="8" fill="#ffd600" text-anchor="middle">★</text>
</svg>
